server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:false}

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:sivarfest_token}
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:true}
app.jwt.cookie-same-site=${APP_JWT_COOKIE_SAME_SITE:Lax}