spring.datasource.url=jdbc:h2:mem:competition_portal_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=test-only-jwt-secret-key-that-is-at-least-32-characters-long
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=sivarfest_token
